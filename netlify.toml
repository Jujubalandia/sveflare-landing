# Single source of truth for the Netlify build. Used identically whether the
# deploy comes from the CLI or from Netlify building the connected Git repo.
#
# The site is a static export (see `output: "export"` in next.config.ts), so
# there is deliberately no @netlify/plugin-nextjs here: nothing needs a
# serverless runtime to serve HTML that is already prerendered.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Next 16 requires Node >= 20.9. Pinned so the build does not depend on
  # whatever the Netlify build image happens to default to.
  NODE_VERSION = "22"

# Next emits every static asset under /_next/static with a content hash in the
# filename, so it is safe to cache them forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML itself must NOT be cached that hard: a redeploy has to be visible.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
